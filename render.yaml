services:
  # Backend FastAPI Web Service
  - type: web
    name: vanta-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -r requirements-adaption.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: data/vanta.sqlite3
      - key: ADAPTION_API_KEY
        sync: false

  # Frontend React Static Site
  - type: web
    name: vanta-ui
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vanta-api
          property: host
