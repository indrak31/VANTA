<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Design World — Explore New Ideas</title>

  <!-- Google Fonts: Poppins (300, 400, 500, 600, 700, 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #scene.dragging {
      cursor: grabbing;
    }

    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .ui a, .ui button {
      pointer-events: auto;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* NAV */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      width: 20px;
      height: 40px;
      background: #fff;
      border-radius: 0 20px 20px 0;
    }
    .logo b {
      font-weight: 700;
    }
    .logo span {
      font-weight: 400;
    }
    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }
    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ARROWS */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }
    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .arrow svg {
      width: 18px;
      height: 18px;
    }
    .arrow:hover {
      background: #fff;
      color: #000;
    }

    /* PAGINATION DOTS */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
    }
    .dot.active {
      background: transparent;
    }

    /* TAGLINE */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
    }
    .tagline strong {
      font-weight: 700;
      display: block;
    }

    /* CTA ROW */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }
    .cta {
      flex: none;
      padding: 0 15px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255, 255, 255, .85);
      border-radius: 6px;
      background: rgba(0, 0, 0, .15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .cta:hover {
      background: #fff;
      color: #000;
    }
    .cta-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255, 255, 255, .8);
      min-width: 40px;
    }
    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
      transform: translateY(6%);
      user-select: none;
    }

    /* LOADER */
    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .6s;
    }
    .loader.done {
      opacity: 0;
      pointer-events: none;
    }

    /* RESPONSIVE */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }
      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }
      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }
    @media (max-width: 640px) {
      .nav-links {
        gap: 16px;
      }
      .nav-links a, .logo {
        font-size: 13px;
      }
      .dots {
        gap: 20px;
        right: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
      }
      .cta-row {
        right: -8vw;
      }
      .count {
        font-size: 120px;
      }
    }
    @media (max-width: 420px) {
      .nav-links li:nth-child(2) {
        display: none;
      }
    }
  </style>

  <!-- Three.js r169 via importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>
      <header class="nav">
        <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </header>
      <div class="arrows">
        <button class="arrow" id="prev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6"/>
          </svg>
        </button>
        <button class="arrow" id="next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
      <nav class="dots">
        <button class="dot" aria-label="Slide 1"></button>
        <button class="dot active" aria-label="Slide 2"></button>
        <button class="dot" aria-label="Slide 3"></button>
      </nav>
      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
      <div class="cta-row">
        <a href="/#app" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>
      <div class="loader" id="loader">Loading model</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

    const canvas = document.getElementById('scene');
    const loaderEl = document.getElementById('loader');

    // 1. Renderer & Camera
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false
    });
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    // 2. Background Scene & Offscreen Headline Canvas
    const bgScene = new THREE.Scene();
    const scene = new THREE.Scene();

    const headlineCanvas = document.createElement('canvas');
    const headlineCtx = headlineCanvas.getContext('2d');
    let bgTexture = new THREE.CanvasTexture(headlineCanvas);
    bgTexture.colorSpace = THREE.SRGBColorSpace;
    bgTexture.minFilter = THREE.LinearFilter;
    bgTexture.magFilter = THREE.LinearFilter;
    bgTexture.generateMipmaps = false;

    const bgQuadGeom = new THREE.PlaneGeometry(2, 2);
    const bgQuadMat = new THREE.ShaderMaterial({
      uniforms: {
        uTex: { value: bgTexture }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      depthTest: false,
      depthWrite: false
    });
    const bgQuad = new THREE.Mesh(bgQuadGeom, bgQuadMat);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    // 3. Render Targets for 2-Pass Screen-Space Refraction
    let rtBack = null;
    let rtFront = null;

    // 4. Glass Shaders
    const vertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const fragmentShader = `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uIorR;
      uniform float uIorY;
      uniform float uIorG;
      uniform float uIorC;
      uniform float uIorB;
      uniform float uIorP;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;

      varying vec3 vNormal;
      varying vec3 vEye;

      float specular(vec3 lightDir, vec3 n, vec3 eye, float shininess, float diffuseness) {
        vec3 lightVec = normalize(-lightDir);
        vec3 viewVec = -eye;
        vec3 halfVec = normalize(lightVec + viewVec);
        return pow(max(dot(n, halfVec), 0.0), shininess) + max(0.0, dot(n, lightVec)) * diffuseness;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) n = -n;
        vec3 eye = normalize(vEye);

        const int LOOP = 16;
        vec3 color = vec3(0.0);

        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;

          vec3 refrR = refract(eye, n, 1.0 / uIorR);
          vec3 refrY = refract(eye, n, 1.0 / uIorY);
          vec3 refrG = refract(eye, n, 1.0 / uIorG);
          vec3 refrC = refract(eye, n, 1.0 / uIorC);
          vec3 refrB = refract(eye, n, 1.0 / uIorB);
          vec3 refrP = refract(eye, n, 1.0 / uIorP);

          vec2 offsetR = refrR.xy * (uRefractPower + slide * 1.0) * uChromatic;
          vec2 offsetY = refrY.xy * (uRefractPower + slide * 1.0) * uChromatic;
          vec2 offsetG = refrG.xy * (uRefractPower + slide * 2.0) * uChromatic;
          vec2 offsetC = refrC.xy * (uRefractPower + slide * 2.5) * uChromatic;
          vec2 offsetB = refrB.xy * (uRefractPower + slide * 3.0) * uChromatic;
          vec2 offsetP = refrP.xy * (uRefractPower + slide * 1.0) * uChromatic;

          vec4 texR = texture2D(uTexture, uv + offsetR);
          vec4 texY = texture2D(uTexture, uv + offsetY);
          vec4 texG = texture2D(uTexture, uv + offsetG);
          vec4 texC = texture2D(uTexture, uv + offsetC);
          vec4 texB = texture2D(uTexture, uv + offsetB);
          vec4 texP = texture2D(uTexture, uv + offsetP);

          float r = texR.r * 0.5;
          float y = (texY.r * 2.0 + texY.g * 2.0 - texY.b) / 6.0;
          float g = texG.g * 0.5;
          float c = (texC.g * 2.0 + texC.b * 2.0 - texC.r) / 6.0;
          float b = texB.b * 0.5;
          float p = (texP.b * 2.0 + texP.r * 2.0 - texP.g) / 6.0;

          float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

          color += vec3(R, G, B);
        }

        color /= float(LOOP);

        // Saturation adjust
        vec3 lumaWeights = vec3(0.2125, 0.7154, 0.0721);
        float luma = dot(color, lumaWeights);
        color = mix(vec3(luma), color, uSaturation);

        // Specular (Blinn-Phong)
        float spec = specular(uLight, n, eye, uShininess, uDiffuseness) +
                     0.6 * specular(vec3(1.0, 1.0, -1.0), n, eye, uShininess * 0.6, uDiffuseness * 0.5);
        color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

        // Fresnel
        float f = pow(clamp(1.0 + dot(eye, n), 0.0, 1.0), uFresnelPower);
        color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

        color += vec3(0.004, 0.005, 0.007);
        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `;

    const commonUniforms = {
      uResolution: { value: new THREE.Vector2() },
      uIorR: { value: 1.15 },
      uIorY: { value: 1.16 },
      uIorG: { value: 1.18 },
      uIorC: { value: 1.22 },
      uIorB: { value: 1.22 },
      uIorP: { value: 1.22 },
      uChromatic: { value: 0.5 },
      uSaturation: { value: 1.08 },
      uShininess: { value: 90.0 },
      uDiffuseness: { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0) },
    };

    const backMat = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      side: THREE.BackSide,
      uniforms: {
        ...THREE.UniformsUtils.clone(commonUniforms),
        uTexture: { value: null },
        uRefractPower: { value: 0.22 },
        uBackside: { value: 1.0 }
      }
    });

    const frontMat = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      side: THREE.FrontSide,
      uniforms: {
        ...THREE.UniformsUtils.clone(commonUniforms),
        uTexture: { value: null },
        uRefractPower: { value: 0.30 },
        uBackside: { value: 0.0 }
      }
    });

    // 5. Scene Graph: scene -> pivot -> spinner -> cubeMesh
    const pivot = new THREE.Group();
    const spinner = new THREE.Group();
    pivot.add(spinner);
    scene.add(pivot);

    spinner.rotation.set(-0.42, 0.62, 0.18);

    let cubeMesh = null;

    function setupMeshWithGeometry(geom) {
      cubeMesh = new THREE.Mesh(geom, frontMat);
      spinner.add(cubeMesh);
      loaderEl.classList.add('done');
      layout();
    }

    function createFallback() {
      const fallbackGeom = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
      fallbackGeom.center();
      fallbackGeom.computeVertexNormals();
      setupMeshWithGeometry(fallbackGeom);
    }

    // Load Model
    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        try {
          const geoms = [];
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.geometry) {
              const g = child.geometry.clone();
              g.deleteAttribute('uv');
              g.deleteAttribute('color');
              g.deleteAttribute('tangent');
              const merged = mergeVertices(g, 1e-4);
              merged.computeVertexNormals();
              child.updateMatrixWorld(true);
              merged.applyMatrix4(child.matrixWorld);
              geoms.push(merged);
            }
          });

          let finalGeom;
          if (geoms.length > 1) {
            finalGeom = mergeGeometries(geoms, false);
          } else if (geoms.length === 1) {
            finalGeom = geoms[0];
          } else {
            createFallback();
            return;
          }

          finalGeom.center();
          finalGeom.computeBoundingBox();
          const bbox = finalGeom.boundingBox;
          const maxDim = Math.max(
            bbox.max.x - bbox.min.x,
            bbox.max.y - bbox.min.y,
            bbox.max.z - bbox.min.z
          );
          if (maxDim > 0) {
            finalGeom.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
          }
          setupMeshWithGeometry(finalGeom);
        } catch (e) {
          console.warn('Geometry processing failed, using fallback:', e);
          createFallback();
        }
      },
      undefined,
      (err) => {
        console.warn('Model loading failed, using fallback:', err);
        createFallback();
      }
    );

    // 6. Layout & Background Drawing
    function redrawHeadline(W, H, dpr) {
      headlineCanvas.width = Math.floor(W * dpr);
      headlineCanvas.height = Math.floor(H * dpr);

      headlineCtx.fillStyle = '#000';
      headlineCtx.fillRect(0, 0, headlineCanvas.width, headlineCanvas.height);

      const mobile = (W < 768) || (W / H < 1);
      let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));

      headlineCtx.font = `800 ${fs * dpr}px Poppins`;
      const lines = ['Explore', 'New', 'Ideas'];
      const maxW = Math.max(...lines.map(l => headlineCtx.measureText(l).width)) / dpr;
      const targetMaxW = W * (mobile ? 0.9 : 0.5);
      if (maxW > targetMaxW && maxW > 0) {
        fs *= (targetMaxW / maxW);
      }

      headlineCtx.font = `800 ${fs * dpr}px Poppins`;
      headlineCtx.fillStyle = '#e9e9e9';
      headlineCtx.textAlign = 'center';
      headlineCtx.textBaseline = 'alphabetic';

      const cx = W * (mobile ? 0.5 : 0.505) * dpr;
      const cy = H * (mobile ? 0.45 : 0.468) * dpr;
      const gap = fs * 1.07 * dpr;
      const cap = fs * 0.7 * dpr;

      for (let i = 0; i < lines.length; i++) {
        const baselineY = cy + cap / 2 + (i - 1) * gap;
        headlineCtx.fillText(lines[i], cx, baselineY);
      }

      bgTexture.needsUpdate = true;
    }

    function layout() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      renderer.setPixelRatio(dpr);
      renderer.setSize(W, H);

      const bufferW = Math.floor(W * dpr);
      const bufferH = Math.floor(H * dpr);

      commonUniforms.uResolution.value.set(bufferW, bufferH);
      frontMat.uniforms.uResolution.value.set(bufferW, bufferH);
      backMat.uniforms.uResolution.value.set(bufferW, bufferH);

      // Recreate or resize Render Targets
      if (!rtBack || rtBack.width !== bufferW || rtBack.height !== bufferH) {
        if (rtBack) rtBack.dispose();
        if (rtFront) rtFront.dispose();

        rtBack = new THREE.WebGLRenderTarget(bufferW, bufferH, {
          type: THREE.HalfFloatType,
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          depthBuffer: true
        });

        rtFront = new THREE.WebGLRenderTarget(bufferW, bufferH, {
          type: THREE.HalfFloatType,
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          depthBuffer: true
        });
      }

      camera.aspect = W / H;
      camera.updateProjectionMatrix();

      redrawHeadline(W, H, dpr);

      // Cube placement
      const mobile = (W < 768) || (W / H < 1);
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const visH = 2 * Math.tan(fovRad / 2) * 10;
      const visW = visH * camera.aspect;

      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;
      pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

      const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
      const scale = (px / H) * visH;
      pivot.scale.set(scale, scale, scale);
    }

    window.addEventListener('resize', layout);
    if (document.fonts) {
      document.fonts.addEventListener('loadingdone', () => {
        layout();
      });
    }

    // 7. Interaction: Drag, Inertia, Idle Drift, Arrows, Dots
    let isDragging = false;
    let lastX = 0;
    let lastY = 0;
    let velX = 0;
    let velY = 0;
    let lastDragEndTime = -10000;
    let remainingArrowTurn = 0;

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      velX = 0;
      velY = 0;
      remainingArrowTurn = 0;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - lastX;
      const deltaY = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      const dx = deltaX * 0.008;
      const dy = deltaY * 0.008;
      velX = dx;
      velY = dy;

      const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
      const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
      spinner.quaternion.premultiply(qY).premultiply(qX);
    });

    const stopDrag = (e) => {
      if (!isDragging) return;
      isDragging = false;
      canvas.classList.remove('dragging');
      lastDragEndTime = performance.now();
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (_) {}
    };

    canvas.addEventListener('pointerup', stopDrag);
    canvas.addEventListener('pointercancel', stopDrag);

    // Prev / Next Arrows
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    prevBtn.addEventListener('click', () => {
      remainingArrowTurn -= Math.PI / 2;
      velX = 0;
      velY = 0;
      lastDragEndTime = performance.now();
    });

    nextBtn.addEventListener('click', () => {
      remainingArrowTurn += Math.PI / 2;
      velX = 0;
      velY = 0;
      lastDragEndTime = performance.now();
    });

    // Pagination Dots
    const dotButtons = document.querySelectorAll('.dots .dot');
    dotButtons.forEach((dot) => {
      dot.addEventListener('click', () => {
        dotButtons.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    // 8. Animation Loop
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      // Handle Smooth Arrow Turn
      if (Math.abs(remainingArrowTurn) > 0.0005) {
        const step = remainingArrowTurn * Math.min(1.0, 0.09 * dt * 60);
        remainingArrowTurn -= step;
        const qTurn = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
        spinner.quaternion.premultiply(qTurn);
      } else {
        remainingArrowTurn = 0;
      }

      // Handle Inertia & Idle Drift
      if (!isDragging && remainingArrowTurn === 0) {
        // Inertia damping
        const damp = Math.pow(0.94, dt * 60);
        velX *= damp;
        velY *= damp;

        if (Math.abs(velX) > 1e-5 || Math.abs(velY) > 1e-5) {
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), velX);
          const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), velY);
          spinner.quaternion.premultiply(qY).premultiply(qX);
        }

        // Idle drift: after 0.6s, ramp in over 1.0s
        const timeSinceDrag = (now - lastDragEndTime) / 1000;
        if (timeSinceDrag > 0.6) {
          const blend = Math.min(1.0, (timeSinceDrag - 0.6) / 1.0);
          const driftY = 0.0035 * blend * (dt * 60);
          const driftX = 0.0012 * blend * (dt * 60);
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), driftY);
          const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), driftX);
          spinner.quaternion.premultiply(qY).premultiply(qX);
        }
      }

      // 9. Two-Pass Render Pipeline
      if (cubeMesh && rtBack && rtFront) {
        backMat.uniforms.uTexture.value = rtBack.texture;
        frontMat.uniforms.uTexture.value = rtFront.texture;

        // 1) Render bgScene -> rtBack
        renderer.setRenderTarget(rtBack);
        renderer.clear();
        renderer.render(bgScene, camera);

        // 2) Render bgScene -> rtFront, then back faces of cube
        renderer.setRenderTarget(rtFront);
        renderer.clear();
        renderer.render(bgScene, camera);

        renderer.autoClear = false;
        cubeMesh.material = backMat;
        renderer.render(scene, camera);

        // 3) Render bgScene -> Screen, then front faces of cube
        renderer.setRenderTarget(null);
        renderer.autoClear = true;
        renderer.render(bgScene, camera);

        renderer.autoClear = false;
        renderer.clearDepth();
        cubeMesh.material = frontMat;
        renderer.render(scene, camera);
        renderer.autoClear = true;
      } else {
        // Fallback or while loading
        renderer.setRenderTarget(null);
        renderer.render(bgScene, camera);
      }
    }

    // Wait for fonts before initial draw
    Promise.race([
      Promise.all([
        document.fonts ? document.fonts.load('800 100px Poppins') : Promise.resolve(),
        document.fonts ? document.fonts.ready : Promise.resolve()
      ]),
      new Promise((resolve) => setTimeout(resolve, 2500))
    ]).then(() => {
      layout();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
